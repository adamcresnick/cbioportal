name: StarRocks backend

on:
  pull_request:
  push:
    branches:
      - "radiant/**"

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/starrocks-inventory/package-lock.json
      - uses: actions/checkout@v4
        with:
          repository: cBioPortal/cbioportal-frontend
          ref: 5eab200650ecc2f111b94fea31f56a2f50a6ad22
          path: target/cbioportal-frontend-v7.0.5
      - name: Install inventory tooling
        run: npm ci --prefix scripts/starrocks-inventory --ignore-scripts
      - name: Compile
        run: mvn -q -DskipTests compile
      - name: Unit and real StarRocks tests
        run: mvn -q -Dtest='Starrocks*Test,ColumnstoreBackend*,IndexTemplateContractTest' test
      - name: Schema and mapper inventory freshness
        run: |
          scripts/test_bootstrap_starrocks.sh
          python3 -m unittest scripts/test_generate_starrocks_schema_inventory.py
          scripts/generate_starrocks_schema_inventory.py --check
          CBIOPORTAL_FRONTEND_ROOT=target/cbioportal-frontend-v7.0.5 \
            scripts/generate_starrocks_frontend_api_inventory.sh --check
      - name: StarRocks mapper dialect lint
        run: scripts/lint_starrocks_mappers.sh
      - name: Formatting
        run: mvn -q spotless:check

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dev/starrocks/e2e/package-lock.json
      - name: Start complete StarRocks deployment
        run: scripts/starrocks/start_local_stack.sh
      - name: Deployment release gates
        run: |
          scripts/starrocks/run_performance_budget.py http://localhost:8080
          scripts/starrocks/verify_no_clickhouse_runtime.sh
          PLAYWRIGHT_INSTALL_DEPS=true scripts/starrocks/run_frontend_e2e.sh
      - name: Capture deployment logs
        if: failure()
        run: |
          mkdir -p target
          docker compose -f dev/starrocks/docker-compose.yml logs --no-color > target/starrocks-deployment.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: starrocks-deployment-logs
          path: |
            target/starrocks-deployment.log
            dev/starrocks/e2e/test-results
          if-no-files-found: ignore
      - name: Remove deployment containers, volumes, and data
        if: always()
        run: scripts/starrocks/stop_local_stack.sh
