columnstore.backend=starrocks
spring.datasource.url=jdbc:mysql://starrocks-fe:9030/${STARROCKS_DATABASE:cbioportal}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${PORTAL_DATABASE_USER:cbioportal}
spring.datasource.password=${PORTAL_DATABASE_PASSWORD:cbioportal-local-only}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
starrocks.query-timeout-seconds=30
starrocks.readiness.required-migration=1

authenticate=false
session.service.url=http://session-service:8080/api/sessions/starrocks_local/
bitly.access.token=
patient_view.url=
sample_view.url=
genomespace=false
show_hotspot=false
show_oncokb=false
